name: Release AI-Quota Extension

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/vscode-extension/package-lock.json'

      - name: Install Dependencies
        run: |
          cd apps/vscode-extension
          npm install

      - name: Compile Extension
        run: |
          cd apps/vscode-extension
          npm run build

      - name: Package VSIX
        run: |
          cd apps/vscode-extension
          npx @vscode/vsce package --no-dependencies --out ../../ai-quota.vsix

      # ──────────────────────────────────────────────────────────────
      # GitHub Release – only runs when triggered by a real git tag
      # Skipped silently on manual workflow_dispatch (no tag present)
      # ──────────────────────────────────────────────────────────────
      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ai-quota.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # Open VSX – always runs when secret exists (fixes skip bug)
      # ──────────────────────────────────────────────────────────────
      - name: Publish to Open VSX Registry (Antigravity IDE, Cursor, VSCodium)
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish ai-quota.vsix -p "$OVSX_PAT"

      # ──────────────────────────────────────────────────────────────
      # VS Code Marketplace – runs when secret exists
      # ──────────────────────────────────────────────────────────────
      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd apps/vscode-extension
          npx @vscode/vsce publish -p "$VSCE_PAT" --no-dependencies
