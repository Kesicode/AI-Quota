name: Release AI-Quota Extension

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/vscode-extension/package-lock.json'

      - name: Install Dependencies
        run: |
          cd apps/vscode-extension
          npm install

      - name: Compile Extension
        run: |
          cd apps/vscode-extension
          npm run build

      - name: Package VSIX
        run: |
          cd apps/vscode-extension
          npx @vscode/vsce package --no-dependencies --out ../../ai-quota.vsix

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          files: ai-quota.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          cd apps/vscode-extension
          npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --no-dependencies

      - name: Publish to Open VSX Registry (Antigravity IDE, Cursor, VSCodium)
        if: env.OVSX_PAT != ''
        run: |
          cd apps/vscode-extension
          npx ovsx publish ../../ai-quota.vsix -p ${{ secrets.OVSX_PAT }}

