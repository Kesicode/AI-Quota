<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Obsidian tile background -->
  <rect width="32" height="32" rx="7" fill="#090a0d"/>
  <rect width="31" height="31" x="0.5" y="0.5" rx="6.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Inactive track ring -->
  <circle cx="15" cy="14.5" r="7.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.8"/>
  
  <!-- Active quota gauge arc -->
  <path d="M 9.7 19.8 A 7.5 7.5 0 1 1 20.3 19.8" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.8" stroke-linecap="round"/>
  
  <!-- Diagonal tick completing the 'Q' -->
  <path d="M 17.5 17 L 22.5 22" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.8" stroke-linecap="round"/>
</svg>
